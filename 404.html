<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found (404) | Global Crimson Education Hub</title>
<meta name="description" content="The page you're looking for doesn't exist. Head back to Global Crimson Education Hub's homepage for study abroad guidance, destinations and classes.">
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://www.globalcrimson.com/">

<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<style>
  .error-page{
    min-height:70vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:80px 28px;
  }
  .error-page .code{
    font-family:var(--serif);
    font-size:clamp(4rem, 14vw, 8rem);
    color:var(--rust);
    line-height:1;
    margin-bottom:10px;
  }
  .error-page h1{ font-size:clamp(1.5rem, 4vw, 2.2rem); margin-bottom:14px; }
  .error-page p{ color:var(--ink-2); max-width:480px; margin:0 auto 30px; }
  .error-actions{ display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
</style>
</head>
<body>

<header>
  <div class="wrap nav">
    <a href="/" class="brand">
      <img src="images/logo.png" alt="Global Crimson Education Hub logo" width="30" height="30">
      Global Crimson Education Hub
    </a>
  </div>
</header>

<main>
  <div class="error-page">
    <div>
      <p class="code" aria-hidden="true">404</p>
      <h1>We can't find that page</h1>
      <p>The link may be broken, or the page may have moved. Let's get you back to studying abroad instead of staring at an error.</p>
      <nav class="error-actions" aria-label="Suggested pages">
        <a href="/" class="btn btn-primary">Back to homepage</a>
        <a href="/#destinations" class="btn btn-ghost">Study destinations</a>
        <a href="/#classes" class="btn btn-ghost">Test prep classes</a>
      </nav>
    </div>
  </div>
</main>

<footer>
  <div class="wrap foot-bottom" style="border-top:none; padding-top:0;">
    <span>© 2026 Global Crimson Education Hub. All rights reserved.</span>
  </div>
</footer>

</body>
</html>
